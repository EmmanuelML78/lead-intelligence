name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: "24.21.0"
  BUN_VERSION: "1.4.2"
  NEXT_TELEMETRY_DISABLED: "1"
  # Throwaway credentials for the ephemeral service container below. They
  # exist only for the lifetime of the job and grant access to nothing else.
  TEST_DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/lead_intelligence_test
  PIPELINE_DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/lead_intelligence_pipeline
  # Pinned assessment date of the synthetic snapshot (see README).
  ASSIGNMENT_BUSINESS_DATE: "2026-09-14"

jobs:
  verify:
    name: Build, test and verify pipeline
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: lead_intelligence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d lead_intelligence_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit

      - name: Show overridden Prisma transitive dependencies
        run: |
          for pkg in prisma @prisma/config deepmerge-ts effect; do
            echo "$pkg $(node -p "require('./node_modules/$pkg/package.json').version")"
          done

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Validate Prisma schema
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: bunx prisma validate

      - name: Apply migrations to the empty test database
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          bun run db:deploy
          bunx prisma migrate status

      # A database built only from the migrations must match schema.prisma.
      # Exit code 2 means drift: add a migration, never edit an applied one.
      - name: Check that migrations match the Prisma schema
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: >-
          bunx prisma migrate diff
          --from-url "$DATABASE_URL"
          --to-schema-datamodel prisma/schema.prisma
          --exit-code

      - name: Type check
        run: bun run typecheck

      - name: Run unit and integration tests
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: bun run test 2>&1 | tee test-output.txt

      - name: Require that no test was skipped
        run: |
          grep -E "^ℹ (tests|pass|fail|cancelled|skipped|todo) " test-output.txt
          if ! grep -qE "^ℹ skipped 0$" test-output.txt; then
            echo "::error::Some tests were skipped; the integration suites must run against PostgreSQL."
            exit 1
          fi

      - name: Build for production
        env:
          DATABASE_URL: ${{ env.PIPELINE_DATABASE_URL }}
        run: bun run build

      - name: Apply migrations to the empty pipeline database
        env:
          DATABASE_URL: ${{ env.PIPELINE_DATABASE_URL }}
        run: bun run db:deploy

      - name: Run pipeline on the synthetic dataset (first run)
        env:
          DATABASE_URL: ${{ env.PIPELINE_DATABASE_URL }}
        run: |
          bun run pipeline
          bun run verify:counts
          bun run scripts/ci-idempotency-check.ts snapshot "$RUNNER_TEMP/table-counts.json"

      - name: Run pipeline again and check idempotency (second run)
        env:
          DATABASE_URL: ${{ env.PIPELINE_DATABASE_URL }}
        run: |
          bun run pipeline
          bun run verify:counts
          bun run scripts/ci-idempotency-check.ts compare "$RUNNER_TEMP/table-counts.json"

      # Keeps the deployment tooling from docs/deployment-runbook.md working:
      # target guard, status report, and a score-only recalculation that must
      # leave assignments and ingested data byte-identical.
      - name: Exercise deployment tooling
        env:
          DATABASE_URL: ${{ env.PIPELINE_DATABASE_URL }}
        run: |
          bun run ops:db-status --expect-host localhost
          bun run ops:fingerprint snapshot "$RUNNER_TEMP/before-rescore.json" --expect-host localhost
          bun run ops:rescore --expect-host localhost --decision-at 2026-09-14T20:00:00.000Z --apply
          bun run ops:fingerprint compare "$RUNNER_TEMP/before-rescore.json" --expect-host localhost             --must-match Assignment,Lead,Customer,Conversation,Message,Advisor,PipelineRun,PipelineIssue
          if bun run ops:db-status --expect-host some-other-database; then
            echo "::error::The target guard accepted a database it was not told to expect."
            exit 1
          fi

      # Real, independent processes against PostgreSQL: while one pipeline
      # holds the exclusive lock every other writer must be refused, and a
      # run killed half way must not block or corrupt the next one.
      - name: Refuse concurrent writers and recover from a killed run
        env:
          DATABASE_URL: ${{ env.PIPELINE_DATABASE_URL }}
        run: |
          wait_for_lock() {
            for attempt in $(seq 1 240); do
              if grep -q "Exclusive lock acquired" "$1" 2>/dev/null; then return 0; fi
              sleep 0.25
            done
            echo "::error::The pipeline never reported acquiring the exclusive lock."
            cat "$1"
            return 1
          }

          bun src/pipeline/run.ts > "$RUNNER_TEMP/holder.log" 2>&1 &
          holder_pid=$!
          wait_for_lock "$RUNNER_TEMP/holder.log"

          refusals=0
          while IFS= read -r writer; do
            if ! kill -0 "$holder_pid" 2>/dev/null; then
              echo "The pipeline finished before '$writer' could be tried; skipping it."
              continue
            fi
            status=0
            $writer > "$RUNNER_TEMP/refused.log" 2>&1 < /dev/null || status=$?
            if kill -0 "$holder_pid" 2>/dev/null; then
              if [ "$status" -ne 75 ]; then
                echo "::error::'$writer' exited with $status instead of 75 while the pipeline was running."
                cat "$RUNNER_TEMP/refused.log"
                exit 1
              fi
              grep "Cannot start" "$RUNNER_TEMP/refused.log"
              refusals=$((refusals + 1))
            fi
          done <<'WRITERS'
          bun run ops:rescore --expect-host localhost --decision-at 2026-09-14T20:00:00.000Z --apply
          bun run pipeline
          bun run analysis:priority
          bun run analysis:assignment
          WRITERS
          wait "$holder_pid"
          if [ "$refusals" -lt 1 ]; then
            echo "::error::No concurrent writer was refused."
            exit 1
          fi
          echo "Writers refused while the pipeline was running: $refusals"

          bun src/pipeline/run.ts > "$RUNNER_TEMP/killed.log" 2>&1 &
          killed_pid=$!
          wait_for_lock "$RUNNER_TEMP/killed.log"
          sleep 2
          kill -9 "$killed_pid"
          wait "$killed_pid" || true

          bun run pipeline | tee "$RUNNER_TEMP/recovered.log"
          grep -q "Marked 1 earlier run(s) left in RUNNING as FAILED" "$RUNNER_TEMP/recovered.log"
          bun run verify:counts

      - name: Check company isolation in the data-access layer
        env:
          DATABASE_URL: ${{ env.PIPELINE_DATABASE_URL }}
        run: bun run verify:isolation

      - name: Smoke test dashboard, health endpoint and company switch
        env:
          DATABASE_URL: ${{ env.PIPELINE_DATABASE_URL }}
          PORT: "3000"
          SMOKE_BASE_URL: http://127.0.0.1:3000
        run: |
          bun run start > "$RUNNER_TEMP/next-start.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail --output /dev/null "$SMOKE_BASE_URL/api/health"; then break; fi
            sleep 1
          done
          status=0
          bun run scripts/ci-dashboard-smoke.ts || status=$?
          echo "--- next start log ---"
          cat "$RUNNER_TEMP/next-start.log"
          exit "$status"
